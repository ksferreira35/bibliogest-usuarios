apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
  namespace: bibliogest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: usuarios
        image: ghcr.io/ksferreira35/bibliogest-usuarios:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: DB_URL
          value: jdbc:postgresql://postgres:5432/bibliogest_usuarios
        - name: KEYCLOAK_BASE_URL
          value: http://keycloak:8080
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: usuarios-db
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: usuarios-db
              key: password
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: usuarios-keycloak
              key: client-secret
        envFrom:
        - configMapRef:
            name: bibliogest-config
        - configMapRef:
            name: usuarios-config
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /usuarios/actuator/health/liveness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /usuarios/actuator/health/liveness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /usuarios/actuator/health/readiness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios
  namespace: bibliogest
spec:
  selector:
    app: usuarios
  ports:
  - port: 8080
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usuarios-from-ingress
  namespace: bibliogest
spec:
  podSelector:
    matchLabels:
      app: usuarios
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: rke2-traefik
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-usuarios
  namespace: bibliogest
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: usuarios
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-from-usuarios
  namespace: bibliogest
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: usuarios
    ports:
    - protocol: TCP
      port: 8080
